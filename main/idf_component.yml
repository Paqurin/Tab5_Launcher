## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=5.3'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  espressif/esp_lvgl_port: ^2.6.0
  # Removed m5stack-tab5 managed component - using local component in ./components/ instead
  espressif/esp_lcd_ili9881c: '*'
  # M5Unified ESP32-P4 port for Tab5 RTC functionality
  Paqurin/M5unified-ESP32P4:
    git: https://github.com/Paqurin/M5unified-ESP32P4.git
  # M5GFX ESP32-P4 port for Tab5 graphics
  Paqurin/M5GFX-Tab5:
    git: https://github.com/Paqurin/M5GFX-Tab5.git

